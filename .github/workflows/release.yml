name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: 8.0.x

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run test suite
        run: dotnet run --project src/SuikodenText.Tests -c Release

  publish:
    name: Publish ${{ matrix.name }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: src/SuikodenText.Cli/SuikodenText.Cli.csproj
            name: SuikodenText-cli
          - project: src/SuikodenText.Desktop/SuikodenText.Desktop.csproj
            name: SuikodenText-desktop
          - project: src/SuikodenText.Translator/SuikodenText.Translator.csproj
            name: SuikodenText-translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Set version suffix
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "suffix=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish ${{ matrix.name }} (win-x64, framework-dependent single-file)
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o publish/${{ matrix.name }}
      - name: Collect exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish/${{ matrix.name }} -Filter *.exe |
              Where-Object { $_.Name -ne 'apphost.exe' } | Select-Object -First 1
          if (-not $exe) { throw "no exe produced in publish output" }
          Copy-Item $exe.FullName "${{ matrix.name }}-${{ steps.ver.outputs.suffix }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ steps.ver.outputs.suffix }}
          path: ${{ matrix.name }}-${{ steps.ver.outputs.suffix }}.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          ls -l dist/
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.exe --clobber
          else
            gh release create "$tag" dist/*.exe --title "$tag" --generate-notes
          fi
